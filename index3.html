<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Data</title>
</head>

<body>
    <h1> " In this project, I have used all the logic and concepts from Phase 6 "</h1>
    <h2> Form basic structure.</h2>
    <hr>

    <form>
        <label for="User">Your Name:</label>
        <input type="text" id="User" placeholder="Full Name" required>
        <br>

        <br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Example@email.com" required>
        <br>


        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="12@*&%we" required>
        <br>

        <br>
        <label for="number">Number:</label>
        <input type="number" name="number" id="number" required>
        <br>

        <br>
        <label for="date"> date of Brith:</label>
        <input type="date" name="date" id="date" required>
        <br>

        <br>
        <label for="color">Choose Your Favourit Color:</label>
        <input type="color" name="color" id="color" value="#fffff">
        <br>

        <br>
        <label for="resume">Upload Your resume: </label>
        <input type="file" name="resume" id="resume">
        <br>

        <br>
        <label><input type="radio" name="gender" value="male">Male</label>
        <label><input type="radio" name="gender" value="female">Female</label>
        <label><input type="radio" name="gender" value="other">Other</label>
        <br>


        <br>
        <p>Pick Your Hobbies</p>
        <label><input type="checkbox" name="hobbies" value="study">Study</label>
        <label><input type="checkbox" name="hobbies" value="sleeping">Sleeping</label>
        <label><input type="checkbox" name="hobbies" value="coding">Coding</label>
        <label><input type="checkbox" name="hobbies" value="geming">Geming</label>
        <br>

        <br>
        <button type="submit"> Sign Up</button>
        <br>

        <br>
        <button type="reset"> Check Here and Reset</button>
        <br>

        <br>
        <button type="button">Click Here</button>
        <br>
    </form>
<hr>

<h2>Fieldset use for diff way to format of Input type</h2>


<form>
<fieldset>
<legend>Personal Information</legend>

<br>
<label for="name"> Name:</label>
<input type="text" id="name" required > 
<br>

<label for="email">Email:</label>
<input type="email" name="email" id="email" placeholder="example@email.com" required>
</fieldset>
<br>

<br>
<fieldset>
<legend>Account Details:</legend>

<label for="pw"> Password:</label>
<input type="pw" name="pw" id="pw" required>
<br>
<label for="color">Color:</label>
<input type="color" name="color" required id="color">
<br>

<label for="Volume">Volume:</label>
<input  type="range" id="volume" name="volume" min="0" max="100" value="50" >
</fieldset>

<br>
<button type="button">Submit</button>
<button type="reset"> Check Here And Reset</button>
<br>

</form>








</body>

</html>
